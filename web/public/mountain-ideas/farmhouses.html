<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Farmhouse Ideas</title>
<style>
  :root { --bg: #efe6d2; --ink: #2f2a22; --muted: #7a6f5c; --card: #fbf7ee; --line: #d9ccb2; }
  * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, serif; }
  header { padding: 28px 24px 8px; max-width: 1500px; margin: 0 auto; } h1 { margin: 0 0 4px; font-size: 26px; } header p { margin: 0; color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; padding: 18px 24px 40px; max-width: 1500px; margin: 0 auto; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .yard { display: grid; place-items: center; padding: 18px; background: radial-gradient(circle at 30% 20%, #8fb35a, #6f9440); }
  .yard img { width: 180px; height: 240px; display: block; }
  .small { display: flex; justify-content: center; gap: 10px; padding: 8px; background: #6f9440; border-top: 1px solid rgba(0,0,0,.1); }
  .small img { width: 66px; height: 88px; }
  figcaption { padding: 10px 14px 12px; } figcaption b { font-size: 16px; } figcaption b span { color: #a0522d; margin-right: 6px; }
  figcaption div { color: var(--muted); font-size: 14px; margin-top: 2px; }
  @media (max-width: 480px) { main { padding: 12px 16px 32px; } header { padding: 20px 16px 4px; } }
</style></head><body>
<header><h1>Ten farmhouse ideas</h1><p>In the cozy hand-crafted top-down style of your reference, each on its 3 × 4 tile plot. Large, and below at about the size it shows in the game.</p></header>
<main>
<figure><div class="yard"><img src="farmhouses/fh-1.svg" alt="Slate & stone"></div><div class="small"><img src="farmhouses/fh-1.svg" alt=""></div><figcaption><b><span>1</span>Slate & stone</b><div>Your reference: grey slate, a plank gable with a round window, a stone ground floor.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-2.svg" alt="Red clay cottage"></div><div class="small"><img src="farmhouses/fh-2.svg" alt=""></div><figcaption><b><span>2</span>Red clay cottage</b><div>Warm clay tiles over white timber-framed plaster, green shutters.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-3.svg" alt="Thatched cottage"></div><div class="small"><img src="farmhouses/fh-3.svg" alt=""></div><figcaption><b><span>3</span>Thatched cottage</b><div>A thick straw roof in bundles, plaster walls, a red door.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-4.svg" alt="Log farmhouse"></div><div class="small"><img src="farmhouses/fh-4.svg" alt=""></div><figcaption><b><span>4</span>Log farmhouse</b><div>A homestead of round logs under wooden shakes, a lean-to shed on the side.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-5.svg" alt="Long farmhouse"></div><div class="small"><img src="farmhouses/fh-5.svg" alt=""></div><figcaption><b><span>5</span>Long farmhouse</b><div>The long side faces you: a deep slate roof, two windows and a porch.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-6.svg" alt="Blue slate & brick"></div><div class="small"><img src="farmhouses/fh-6.svg" alt=""></div><figcaption><b><span>6</span>Blue slate & brick</b><div>Cool blue slate, a brick chimney, cream plaster and timber.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-7.svg" alt="Mossy old farmhouse"></div><div class="small"><img src="farmhouses/fh-7.svg" alt=""></div><figcaption><b><span>7</span>Mossy old farmhouse</b><div>An old stone house: the roof greened with moss, cobbles, a weathervane.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-8.svg" alt="Farmhouse with dormers"></div><div class="small"><img src="farmhouses/fh-8.svg" alt=""></div><figcaption><b><span>8</span>Farmhouse with dormers</b><div>A big front-gabled house with dormer windows on both slopes and a porch.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-9.svg" alt="Shingled barn house"></div><div class="small"><img src="farmhouses/fh-9.svg" alt=""></div><figcaption><b><span>9</span>Shingled barn house</b><div>Long side to the front, wooden shakes, a barn-red door and dormers.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/fh-10.svg" alt="Little clay farmstead"></div><div class="small"><img src="farmhouses/fh-10.svg" alt=""></div><figcaption><b><span>10</span>Little clay farmstead</b><div>A smaller clay-roofed house with a porch, flowers and a cart wheel.</div></figcaption></figure>
</main></body></html>
