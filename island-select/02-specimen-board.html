<!--
  Concept 02: The Specimen Board
  Idea: every island is a specimen card pinned or taped to a journal page (coastline chart, "from above" inset,
        handwritten note, No. label); picking one turns the page to that island's spread with its painted view.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your islands - Unclaimed Acres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="journal.css">
<style>
  /* ---------- header account chip ---------- */
  .account { display: flex; align-items: center; gap: 14px; }
  .acct-chip { display: inline-flex; align-items: center; gap: .55em; font-family: var(--sc); letter-spacing: .08em; font-size: 1rem; color: var(--ink);
    padding: .5em 1em .45em; border: 1px solid var(--rule); border-radius: 30px; background: rgba(253, 249, 239, .65); box-shadow: 0 2px 6px -3px rgba(60,45,20,.35); }
  .acct-chip svg { width: 1.15em; height: 1.15em; color: var(--rust); }
  .acct-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--moss); box-shadow: 0 0 0 3px rgba(95,109,59,.18); }
  .signout { font-family: var(--hand); font-size: 1.35rem; color: var(--blue); text-decoration: none; }
  .signout:hover { text-decoration: underline; text-underline-offset: 4px; }
  main { padding: 6px 0 90px; }
  [hidden] { display: none !important; }
  body { min-height: 100vh; }
  .signout { white-space: nowrap; }
  @media (max-width: 640px) {
    .top .wrap { gap: 10px; }
    .account { flex-direction: column; align-items: flex-end; gap: 0; }
    .brand { gap: 10px; }
    .brand-name { font-size: 1.3rem; white-space: nowrap; }
    .brand-stamp { width: 42px; height: 42px; }
  }

  /* ---------- the board page ---------- */
  .board-sheet { padding: 40px 52px 46px;
    background-image: var(--noise), var(--fibres),
      linear-gradient(rgba(37,70,127,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(37,70,127,.07) 1px, transparent 1px);
    background-size: auto, auto, 28px 28px, 28px 28px; }
  .board-sheet::before { content: ""; position: absolute; inset: 8px -6px -10px; z-index: -1; border-radius: 6px;
    background: repeating-linear-gradient(0deg, #e8dcc0 0 2px, #d8c8a4 2px 3px); box-shadow: 0 30px 60px -30px rgba(50,35,10,.6); }
  .entry-meta { display: flex; justify-content: space-between; gap: 16px; font-family: var(--hand); color: var(--blue); font-size: 1.35rem;
    border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin-bottom: 22px; }
  .board-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 30px; margin-bottom: 36px; }
  .board-sheet.has-many .board-head h1 { font-size: clamp(2.2rem, 1.5rem + 1.6vw, 2.9rem); }
  .board-sheet.has-many .entry-meta { margin-bottom: 16px; }
  .board-head h1 { font-size: clamp(2.4rem, 1.6rem + 2vw, 3.4rem); margin: 0; }
  .board-head h1 em { font-style: italic; color: var(--blue); }
  .board-head .kicker { margin-bottom: 8px; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .switch { display: inline-flex; border: 1px solid var(--rule); border-radius: 30px; padding: 3px; background: rgba(253,249,239,.6); }
  .switch button { font-family: var(--sc); letter-spacing: .08em; font-size: .95rem; color: var(--ink-soft); background: none; border: 0; border-radius: 30px;
    padding: .38em 1em .32em; cursor: pointer; display: inline-flex; align-items: center; gap: .45em; }
  .switch button svg { width: 1em; height: 1em; }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .search { position: relative; }
  .search input { font-family: var(--hand); font-size: 1.35rem; color: var(--blue); width: 230px; padding: 4px 6px 4px 30px; border: 0;
    border-bottom: 1.5px solid var(--ink-soft); background: transparent; }
  .search input::placeholder { color: rgba(37,70,127,.45); }
  .search input:focus { outline: none; border-bottom-color: var(--blue); }
  .search:focus-within { outline: 3px solid var(--blue); outline-offset: 4px; border-radius: 4px; }
  .search svg { position: absolute; left: 4px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--ink-soft); }

  /* ---------- specimen cards ---------- */
  .board { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 50px 38px; }
  .board.many { grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 44px 30px; }
  .board > li { position: relative; }
  .isle-card { height: 100%; display: flex; flex-direction: column; }
  .isle-card .art { border: 1px solid rgba(43,39,33,.28); background: #eef0e6; }
  .isle-card .art svg.coast { position: absolute; inset: 0; width: 100%; height: 100%; }
  .isle-card .art .north { position: absolute; left: 7px; bottom: 6px; width: 20px; height: 26px; color: var(--ink-soft); }
  .isle-card .above { overflow: visible; }
  .isle-card .above .disc { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
  .isle-card .above img { width: 100%; height: 100%; object-fit: cover; }
  .isle-card .note { flex: 1; }
  .isle-card .stats { margin: 8px 0 0; padding-top: 6px; border-top: 1px dashed rgba(180,156,116,.8); font-family: var(--sc); font-size: .74rem;
    letter-spacing: .1em; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .isle-card .stats b { font-family: var(--serif); font-weight: 600; letter-spacing: 0; color: var(--ink); font-size: .92rem; }
  .hit { position: absolute; inset: 0; z-index: 4; border-radius: 2px; }
  .hit:focus-visible { outline-offset: 6px; }
  li:has(.hit:hover) .specimen, li:has(.hit:focus-visible) .specimen { transform: rotate(0deg) translateY(-5px); box-shadow: var(--shadow), 0 26px 40px -22px rgba(60,45,20,.55); }
  .board.many .specimen { padding: 28px 13px 12px; }
  .board.many .specimen .above { width: 54px; height: 54px; top: -20px; padding: 4px; }
  .board.many .specimen .above span { display: none; }
  .board.many .specimen figcaption b { font-size: 1.15rem; }
  .board.many .specimen .note { font-size: 1.08rem; }
  .board.many .isle-card .stats { font-size: .64rem; gap: 0 7px; letter-spacing: .06em; }
  .board.many .isle-card .stats b { font-size: .82rem; }

  .new-card { width: 100%; height: 100%; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border: 2px dashed rgba(37,70,127,.45); border-radius: 3px; background: rgba(253,249,239,.35); color: var(--blue); cursor: pointer;
    font-family: var(--hand); font-size: 1.6rem; line-height: 1.05; padding: 24px; transform: rotate(.8deg); transition: background .2s ease, transform .3s ease; }
  .new-card:hover { background: rgba(253,249,239,.75); transform: rotate(0deg) translateY(-4px); }
  .new-card .plus { width: 64px; height: 64px; border-radius: 50%; border: 1.5px dashed currentColor; display: grid; place-items: center; font-family: var(--serif); font-size: 2.4rem; line-height: 1; }
  .new-card small { font-family: var(--sc); font-size: .74rem; letter-spacing: .12em; color: var(--rust); }
  .board.many .new-card { min-height: 250px; font-size: 1.4rem; }

  .empty { font-family: var(--hand); color: var(--blue); font-size: 1.6rem; text-align: center; padding: 40px 0 10px; }

  /* ---------- compact index (ledger) ---------- */
  .ledger { width: 100%; border-collapse: collapse; }
  .ledger caption { text-align: left; }
  .ledger th { font-family: var(--sc); font-weight: 400; letter-spacing: .12em; font-size: .8rem; color: var(--rust); text-align: left; padding: 0 12px 8px; border-bottom: 1.5px solid var(--ink-soft); }
  .ledger td { padding: 8px 12px; border-bottom: 1px solid rgba(180,156,116,.6); vertical-align: middle; }
  .ledger tbody tr { cursor: pointer; transition: background .15s ease; }
  .ledger tbody tr:hover { background: rgba(37,70,127,.05); }
  .ledger .no { font-family: var(--display); font-style: italic; color: var(--rust); width: 56px; }
  .ledger .mini { width: 58px; }
  .ledger .mini svg { width: 44px; height: 44px; display: block; background: #eef0e6; border: 1px solid rgba(43,39,33,.25); }
  .ledger .nm a { font-family: var(--display); font-size: 1.32rem; color: var(--ink); text-decoration: none; }
  .ledger .nm a:hover { color: var(--blue); }
  .ledger .nm span { font-family: var(--hand); color: var(--blue); font-size: 1.2rem; margin-left: 12px; }
  .ledger .num { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .ledger .when { font-family: var(--hand); color: var(--ink-soft); font-size: 1.2rem; white-space: nowrap; }
  .ledger .go { text-align: right; }
  .ledger-new { margin-top: 22px; }

  /* ---------- a dashed "chart a new island" link ---------- */
  .chart-new { display: inline-flex; align-items: center; gap: .5em; font-family: var(--hand); font-size: 1.5rem; color: var(--blue); background: none; border: 0; cursor: pointer; padding: 0; }
  .chart-new i { width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed currentColor; display: grid; place-items: center; font-style: normal; font-family: var(--serif); font-size: 1.5rem; line-height: 1; }
  .chart-new:hover span { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }

  /* ---------- the island spread ---------- */
  .book { margin-top: 8px; }
  .book .page { min-height: 690px; }
  .spread-l .leaf-body { display: flex; flex-direction: column; }
  .painted { transform: rotate(-1.3deg); margin: 6px 6px 0; }
  .painted .tape.a { top: -12px; left: 34px; transform: rotate(-7deg); }
  .painted .tape.b { top: -10px; right: 34px; transform: rotate(6deg); }
  .painted .crop { overflow: hidden; aspect-ratio: 1600 / 907; }
  .painted .crop img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: auto; }
  .painted figcaption { text-align: left; }
  .under-photo { display: grid; grid-template-columns: 170px 1fr; gap: 26px; align-items: center; margin-top: 34px; }
  .coast-card { position: relative; margin: 0; background: var(--card); background-image: var(--noise); padding: 22px 12px 8px; box-shadow: var(--shadow); transform: rotate(2.2deg); }
  .coast-card .pin { top: 7px; }
  .coast-card svg { display: block; width: 100%; height: auto; background: #eef0e6; border: 1px solid rgba(43,39,33,.28); }
  .coast-card figcaption { font-family: var(--sc); font-size: .72rem; letter-spacing: .12em; color: var(--ink-soft); text-align: center; margin-top: 4px; }
  .margin-note { font-family: var(--hand); color: var(--blue); font-size: 1.45rem; line-height: 1.2; transform: rotate(-2deg); padding-left: 16px; border-left: 2px solid var(--blue-soft); margin: 0; }
  .margin-note b { font-family: var(--sc); font-weight: 400; color: var(--ink-soft); font-size: .8rem; letter-spacing: .12em; display: block; }

  .roman { font-family: var(--display); color: var(--rust); font-size: 1.25rem; display: block; margin-bottom: 6px; font-style: italic; }
  .spread-r h1 { outline: none; }
  .spread-r .say { font-family: var(--hand); color: var(--blue); font-size: 1.9rem; line-height: 1.1; margin: -6px 0 26px; transform: rotate(-1deg); }
  .measures { margin: 0 0 30px; padding: 0; list-style: none; }
  .measures li { display: grid; grid-template-columns: 118px 1fr 64px; align-items: center; gap: 14px; padding: 7px 0; border-bottom: 1px dashed rgba(180,156,116,.7); }
  .measures li > span:first-child { font-family: var(--sc); letter-spacing: .1em; font-size: .9rem; color: var(--ink-soft); }
  .measures .bar { height: 9px; border: 1px solid rgba(43,39,33,.35); border-radius: 1px; position: relative; overflow: hidden;
    background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(43,39,33,.18) calc(10% - 1px) 10%); }
  .measures .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--v); background: var(--c, var(--blue)); opacity: .78; }
  .measures b { font-family: var(--display); font-weight: 400; font-size: 1.25rem; text-align: right; font-variant-numeric: tabular-nums; }
  .measures-note { font-family: var(--hand); color: var(--ink-soft); font-size: 1.15rem; margin: -20px 0 26px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
  .folio a.turn-link[aria-disabled="true"] { visibility: hidden; }

  /* single island: the proud specimen */
  .solo .specimen { height: auto; }
  .solo .specimen .note { flex: none; margin-bottom: 6px; }
  .solo .specimen { --r: -1.8deg; width: min(392px, 92%); margin: 18px auto 0; padding: 38px 24px 16px; }
  .solo .specimen .tape { left: 26px; transform: rotate(-9deg); }
  .solo .specimen .tape.b { left: auto; right: 26px; transform: rotate(8deg); }
  .solo .specimen .pin { top: 14px; }
  .solo .specimen .above { width: 132px; height: 132px; right: -40px; top: -44px; padding: 7px; border-width: 2px; }
  .solo .specimen .above span { right: 4px; top: -34px; font-size: 1.3rem; transform: rotate(4deg); }
  .solo .specimen figcaption b { font-size: 1.8rem; }
  .solo .specimen figcaption small { font-size: .85rem; }
  .solo .specimen .note { font-size: 1.5rem; }
  .solo .specimen .measure span { font-size: 1.2rem; }
  .solo-label { font-family: var(--hand); color: var(--blue); font-size: 1.45rem; transform: rotate(-4deg); display: inline-flex; gap: .3em; align-items: center; margin: 0 0 0 20px; }
  .solo-label svg { width: 34px; height: 30px; }
  .more-room { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(180,156,116,.5); }
  .more-room p { font-family: var(--hand); color: var(--ink-soft); font-size: 1.25rem; margin: 0 0 6px; }

  /* page-turn in */
  @keyframes leaf-in { from { transform: rotateY(-88deg); opacity: .4; } to { transform: rotateY(0); opacity: 1; } }
  @keyframes leaf-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes board-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .book.opening .page-r { transform-origin: left center; animation: leaf-in .7s cubic-bezier(.45,.05,.3,1) both; }
  .book.opening .page-l { animation: leaf-fade .5s ease both; }
  .board-sheet.returning { animation: board-in .45s ease both; }

  @media (max-width: 1180px) {
    .under-photo { grid-template-columns: 140px 1fr; }
  }
  @media (max-width: 980px) {
    .book { margin-top: 10px; }
    .book .page { min-height: 0; }
    .solo .specimen .above { width: 96px; height: 96px; right: -14px; top: -34px; }
    .ledger .num.hide-sm, .ledger th.hide-sm { display: none; }
  }
  @media (max-width: 640px) {
    .acct-chip { font-size: .85rem; padding: .45em .8em .4em; }
    .acct-chip svg { display: none; }
    .signout { font-size: 1.15rem; }
    .board-sheet { padding: 26px 16px 30px; }
    .board, .board.many { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px 16px; }
    .specimen, .board.many .specimen { padding: 26px 10px 10px; }
    .specimen .above, .board.many .specimen .above { width: 46px; height: 46px; top: -14px; right: -6px; padding: 3px; }
    .specimen .above span { display: none; }
    .specimen figcaption { flex-direction: column; gap: 0; }
    .specimen figcaption b { font-size: 1.1rem; }
    .isle-card .stats { font-size: .62rem; gap: 0 6px; }
    .new-card, .board.many .new-card { min-height: 220px; font-size: 1.25rem; }
    .search input { width: 100%; }
    .search, .tools { width: 100%; }
    .ledger .mini, .ledger th.mini, .ledger .when, .ledger th.when { display: none; }
    .ledger td, .ledger th { padding-left: 6px; padding-right: 6px; }
    .ledger .nm span { display: block; margin: 0; }
    .ledger .go .btn { padding: .5em .8em .45em; font-size: .85rem; }
    .under-photo { grid-template-columns: 1fr; }
    .coast-card { width: 60%; margin-inline: auto; }
    .measures li { grid-template-columns: 96px 1fr 54px; gap: 10px; }
    .solo-label { font-size: 1.15rem; margin-left: 0; }
    .measure span { white-space: nowrap; font-size: .9rem; }
    .entry-meta { font-size: 1.1rem; }
    .page-l .folio { display: none; }
    .painted figcaption { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .solo .specimen { padding: 32px 14px 14px; }
    .solo .specimen .above { width: 78px; height: 78px; right: -6px; top: -26px; }
    .solo .specimen .above span { display: none; }
    .solo .specimen figcaption { flex-direction: row; }
    .solo .specimen figcaption b { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Unclaimed Acres, your islands">
      <svg class="brand-stamp" width="64" height="64" aria-hidden="true"><use href="#stamp-mark"/></svg>
      <span class="brand-name">Unclaimed Acres<small>a field journal</small></span>
    </a>
    <div class="account">
      <span class="acct-chip" title="Signed in"><i aria-hidden="true"></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 9h14a2 2 0 0 0 2-2V5"/></svg><span class="sr-only">Signed in as </span><span id="who">fennel.wam</span></span>
      <a class="signout" href="#sign-out">Sign out</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="app" aria-live="polite"></div>
</main>

<script src="islands.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var list = [], state = { view: 'board', q: '' };
  try { state.view = localStorage.getItem('ua-board-view') === 'index' ? 'index' : 'board'; } catch (e) {}
  if (/[?&]view=index/.test(location.search)) state.view = 'index';
  var ROT = [-1.6, 1.4, -0.8, 2, 1, -2, 1.8, -1.2, .6, -1.5];
  var TAPE = [-3, 4, -5, 3, -2, 5];
  var ARROW_R = '<svg width="34" height="18" viewBox="0 0 34 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 10c8-3 18-4 29-1M25 3c2.5 2 4.5 4 6 6-2.5 1.3-5 3-7 5"/></svg>';
  var ARROW_L = '<svg width="34" height="18" viewBox="0 0 34 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M32 10C24 7 14 6 3 9M9 3C6.5 5 4.5 7 3 9c2.5 1.3 5 3 7 5"/></svg>';
  var ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c3-1 5-4 6-8M10 12c1.5-4 5-7 10-8-1 5-4 8.5-8 10"/><path d="M14 4h6v6"/></svg>';
  var NORTH = '<svg class="north" viewBox="0 0 20 26" aria-hidden="true"><path d="M10 6l4 14-4-3-4 3z" fill="currentColor" opacity=".7"/><text x="10" y="5.5" font-size="6.5" text-anchor="middle" fill="currentColor" font-family="IM Fell English SC, serif">N</text></svg>';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function no(i) { return 'No. ' + (i + 1 < 10 ? '0' : '') + (i + 1); }
  function pct(v) { return v > 0 && v < 1 ? '&lt;1%' : Math.round(v) + '%'; }
  function chart(isl, label) {
    return UA.outline(isl, { sea: '#e7ebe1', land: '#f8f0d9', ink: '#2b2721', stroke: .55, grid: 'rgba(37,70,127,.16)', pad: 3, label: label })
      .replace('<svg ', '<svg class="coast" ');
  }
  function render(isl, alt) {
    return '<img src="' + isl.render + '" alt="' + esc(alt || '') + '" style="transform:' + isl.renderTransform + '"' + (isl.index > 9 ? ' loading="lazy"' : '') + '>';
  }
  function statLine(s) {
    var p = ['<span>forest <b>' + pct(s.forest) + '</b></span>', '<span>peaks <b>' + pct(s.mountain) + '</b></span>', '<span>beach <b>' + pct(s.beach) + '</b></span>'];
    if (s.freshWater >= 1) p.push('<span>lakes <b>' + pct(s.freshWater) + '</b></span>');
    return p.join('');
  }
  function newCard(n) {
    return '<li><button class="new-card" type="button" data-new><span class="plus" aria-hidden="true">+</span>chart a new island<small>' + no(n) + ' &middot; unwritten</small></button></li>';
  }
  function card(isl, big) {
    var i = isl.index, fix = (i % 3 === 1) ? '<span class="tape" aria-hidden="true"></span>' : '<span class="pin" aria-hidden="true"></span>';
    if (big) fix = '<span class="tape" aria-hidden="true"></span><span class="tape b" aria-hidden="true"></span><span class="pin" aria-hidden="true"></span>';
    return '<figure class="specimen isle-card" style="--r:' + ROT[i % ROT.length] + 'deg;--t:' + TAPE[i % TAPE.length] + 'deg">' + fix +
      '<div class="art">' + chart(isl, 'Coastline chart of ' + esc(isl.name)) + NORTH +
        '<div class="above"><div class="disc">' + render(isl, '') + '</div><span>from above</span></div></div>' +
      '<div class="measure" aria-hidden="true"><span>' + pct(isl.stats.land) + ' land</span></div>' +
      '<figcaption><b>' + esc(isl.name) + '</b><small>' + no(i) + '</small></figcaption>' +
      '<p class="note">' + esc(isl.note) + '</p>' +
      '<p class="stats"><span class="sr-only">Land ' + Math.round(isl.stats.land) + ' percent. </span>' + statLine(isl.stats) + '</p></figure>';
  }
  function measures(s) {
    var rows = [['land', s.land, 'var(--moss)'], ['forest', s.forest, '#3f6b3a'], ['mountain', s.mountain, '#7b7466'], ['beach', s.beach, '#c9a55a'], ['fresh water', s.freshWater, '#2f6f86']];
    return '<ul class="measures" aria-label="Field measurements">' + rows.map(function (r) {
      return '<li><span>' + r[0] + '</span><span class="bar" aria-hidden="true"><i style="--v:' + Math.min(100, r[1]) + '%;--c:' + r[2] + '"></i></span><b>' + pct(r[1]) + '</b></li>';
    }).join('') + '</ul><p class="measures-note">share of the whole chart, sea included</p>';
  }
  function chartNew(txt) {
    return UA.canCreate ? '<button class="chart-new" type="button" data-new><i aria-hidden="true">+</i><span>' + (txt || 'chart a new island') + '</span></button>' : '';
  }

  /* ---------- views ---------- */
  function filtered() {
    var q = state.q.trim().toLowerCase();
    return !q ? list : list.filter(function (x) { return (x.name + ' ' + x.note).toLowerCase().indexOf(q) >= 0; });
  }
  function boardView() {
    var many = list.length > 8, tools = '';
    if (many) {
      tools = '<div class="tools">' +
        '<div class="switch" role="group" aria-label="Layout">' +
          '<button type="button" data-view="board" aria-pressed="' + (state.view === 'board') + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg>Board</button>' +
          '<button type="button" data-view="index" aria-pressed="' + (state.view === 'index') + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1.5 3h13M1.5 8h13M1.5 13h13"/></svg>Index</button></div>' +
        '<label class="search"><span class="sr-only">Search your islands</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>' +
          '<input id="q" type="search" placeholder="find an island..." autocomplete="off" value="' + esc(state.q) + '"></label></div>';
    }
    var h = '<section class="sheet board-sheet' + (many ? ' has-many' : '') + '" aria-labelledby="board-title">' +
      '<div class="entry-meta"><span>Specimen board, kept by ' + esc(UA.player) + '</span><span>' + list.length + ' islands pinned</span></div>' +
      '<div class="board-head"><div><p class="kicker">Your islands</p><h1 id="board-title">Pick an island, <em>any</em> island.</h1></div>' + tools + '</div>' +
      '<div id="items"></div></section>';
    app.innerHTML = h;
    items();
    var q = document.getElementById('q');
    if (q) q.addEventListener('input', function () { state.q = q.value; items(); });
  }
  function items() {
    var box = document.getElementById('items'), f = filtered(), many = list.length > 8, h = '';
    if (state.view === 'index' && many) {
      h = '<table class="ledger"><caption class="sr-only">Index of your islands</caption><thead><tr><th>No.</th><th class="mini"><span class="sr-only">Chart</span></th><th>Island</th>' +
        '<th class="hide-sm">Land</th><th class="hide-sm">Forest</th><th class="when">Last visit</th><th class="go"><span class="sr-only">Enter</span></th></tr></thead><tbody>' +
        f.map(function (x) {
          return '<tr data-open="' + (x.index + 1) + '"><td class="no">' + (x.index + 1) + '</td><td class="mini">' + UA.outline(x, { sea: '#e7ebe1', land: '#f8f0d9', stroke: .8, pad: 3, shore: false }) + '</td>' +
            '<td class="nm"><a href="#isle-' + (x.index + 1) + '">' + esc(x.name) + '</a><span>' + esc(x.note) + '</span></td>' +
            '<td class="num hide-sm">' + pct(x.stats.land) + '</td><td class="num hide-sm">' + pct(x.stats.forest) + '</td><td class="when">' + esc(x.lastVisit) + '</td>' +
            '<td class="go"><a class="btn small" href="#enter-' + x.id + '" aria-label="Enter ' + esc(x.name) + '">Enter</a></td></tr>';
        }).join('') + '</tbody></table>';
      if (UA.canCreate) h += '<div class="ledger-new">' + chartNew() + '</div>';
    } else {
      h = '<ul class="board' + (many ? ' many' : '') + '" aria-label="Your islands">' + f.map(function (x) {
        return '<li>' + card(x) + '<a class="hit" href="#isle-' + (x.index + 1) + '" aria-label="Open ' + esc(x.name) + ', ' + esc(x.note) + '"></a></li>';
      }).join('') + (UA.canCreate && !state.q.trim() ? newCard(list.length) : '') + '</ul>';
    }
    if (!f.length) h = '<p class="empty">no island by that name in this journal &mdash; try another word</p>';
    box.innerHTML = h;
  }

  function spread(isl, opening) {
    var solo = list.length === 1, i = isl.index, n = list.length;
    var prev = list[(i - 1 + n) % n], next = list[(i + 1) % n];
    var left = solo
      ? '<div class="leaf-body solo"><p class="solo-label" aria-hidden="true">specimen no. 1, pinned with care <svg viewBox="0 0 34 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4c2 10 9 18 26 20M22 18c3 2 5 4 7 6-3 1-6 2-8 4"/></svg></p>' + card(isl, true) + '</div>' +
        '<div class="folio"><span>1</span></div>'
      : '<div class="leaf-body"><figure class="photo painted"><span class="tape a" aria-hidden="true"></span><span class="tape b" aria-hidden="true"></span>' +
          '<div class="crop">' + render(isl, 'A painted view of ' + isl.name + ' from above: beaches, forest and hills in the sea.') + '</div>' +
          '<figcaption>fig. ' + (i + 1) + ' &mdash; ' + esc(isl.name) + ', from above</figcaption></figure>' +
        '<div class="under-photo"><figure class="coast-card"><span class="pin" aria-hidden="true"></span>' + UA.outline(isl, { sea: '#e7ebe1', land: '#f8f0d9', stroke: .55, grid: 'rgba(37,70,127,.16)', pad: 3 }) +
          '<figcaption>the coastline</figcaption></figure>' +
          '<p class="margin-note"><b>Charted</b>' + esc(isl.charted) + '<br><b style="margin-top:8px">Last visit</b>' + esc(isl.lastVisit) + '</p></div></div>' +
        '<div class="folio"><a class="turn-link" href="#isle-' + (prev.index + 1) + '"' + (n < 2 ? ' aria-disabled="true"' : '') + '>' + ARROW_L + ' ' + esc(prev.name) + '</a><span>' + (2 * i + 2) + '</span></div>';
    var right = '<div class="leaf-body">' +
        '<span class="roman">' + (solo ? 'Your island' : 'Specimen ' + no(i)) + '</span>' +
        '<h1 id="isle-title" tabindex="-1">' + esc(isl.name) + '</h1>' +
        '<p class="say">&ldquo;' + esc(isl.note) + '&rdquo;</p>' +
        measures(isl.stats) +
        (solo ? '<p class="margin-note" style="margin:-6px 0 28px">charted ' + esc(isl.charted) + ' &middot; last visit ' + esc(isl.lastVisit) + '</p>' : '') +
        '<div class="actions"><a class="btn" href="#enter-' + isl.id + '">' + ENTER + ' Enter island</a>' +
        (solo ? '' : '<a class="link-hand" href="#board">' + ARROW_L + ' back to the board</a>') + '</div>' +
        (solo && UA.canCreate ? '<div class="more-room"><p>room for more in this journal</p>' + chartNew() + '</div>' : '') +
      '</div>' +
      '<div class="folio">' + (solo ? '<span>2</span>' : '<span>' + (2 * i + 3) + '</span><a class="turn-link" href="#isle-' + (next.index + 1) + '">' + esc(next.name) + ' ' + ARROW_R + '</a>') + '</div>';
    app.innerHTML = '<article class="book' + (opening ? ' opening' : '') + '" aria-labelledby="isle-title">' +
      '<div class="page page-l spread-l sheet"><div class="leaf">' + left + '</div></div>' +
      '<div class="page page-r spread-r sheet"><div class="leaf">' + right + '</div></div></article>';
  }

  /* ---------- routing ---------- */
  var lastOpen = null;
  function route(first) {
    var m = /^#isle-(\d+)$/.exec(location.hash), isl = m && list[Number(m[1]) - 1];
    if (list.length === 1) { spread(list[0], false); return; }
    if (isl) {
      spread(isl, !first);
      lastOpen = isl.index;
      if (!first) document.getElementById('isle-title').focus({ preventScroll: true });
      window.scrollTo(0, 0);
    } else {
      boardView();
      if (!first) {
        document.querySelector('.board-sheet').classList.add('returning');
        var back = lastOpen != null && document.querySelector('[href="#isle-' + (lastOpen + 1) + '"]');
        if (back) { back.focus({ preventScroll: true }); back.scrollIntoView({ block: 'center' }); }
      }
    }
  }
  window.addEventListener('hashchange', function () { if (/^#(isle-\d+|board)?$/.test(location.hash)) route(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && /^#isle-/.test(location.hash) && list.length > 1) location.hash = '#board';
    if (/^#isle-/.test(location.hash) && list.length > 1 && !/input|textarea/i.test(e.target.tagName)) {
      var i = Number(location.hash.slice(6)) - 1, n = list.length;
      if (e.key === 'ArrowRight') location.hash = '#isle-' + ((i + 1) % n + 1);
      if (e.key === 'ArrowLeft') location.hash = '#isle-' + ((i - 1 + n) % n + 1);
    }
  });
  app.addEventListener('click', function (e) {
    var v = e.target.closest('[data-view]');
    if (v) { state.view = v.getAttribute('data-view'); try { localStorage.setItem('ua-board-view', state.view); } catch (err) {}
      document.querySelectorAll('[data-view]').forEach(function (b) { b.setAttribute('aria-pressed', b === v); }); items(); return; }
    var row = e.target.closest('tr[data-open]');
    if (row && !e.target.closest('a')) { location.hash = '#isle-' + row.getAttribute('data-open'); return; }
    if (e.target.closest('[data-new]')) { location.hash = '#chart-new'; }
  });

  UA.islands().then(function (l) { list = l; route(true); });
})();
</script>
</body>
</html>
