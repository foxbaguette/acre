<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Vectors</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f3f1ec;
    color: #2b2622;
    padding: 24px 16px;
  }
  .app { max-width: 1100px; margin: 0 auto; display: grid; gap: 24px; }
  .top {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(240px, 320px);
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 760px) { .top { grid-template-columns: 1fr; } }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
  }
  .stage svg { width: 100%; height: auto; display: block; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 8px 0 0; color: #6c655e; text-transform: uppercase; letter-spacing: .06em; }
  .muted { margin: 0 0 16px; color: #6c655e; font-size: 14px; }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid #eee9e2;
  }
  .row:first-of-type { border-top: 0; }
  .row label { font-weight: 600; font-size: 14px; }
  .row small { display: block; font-weight: 400; color: #8a827a; font-size: 12px; }
  .row input[type="color"] {
    width: 44px; height: 44px; padding: 0; border: 0;
    border-radius: 12px; background: none; cursor: pointer;
  }
  .row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .row input[type="color"]::-webkit-color-swatch { border: 2px solid #e5dfd6; border-radius: 12px; }
  .row code { font-size: 12px; color: #8a827a; font-family: ui-monospace, Consolas, monospace; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1; padding: 10px 14px; border: 0; border-radius: 12px;
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    background: #ece7df; color: #2b2622;
  }
  button.primary { background: #2b2622; color: #fff; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .thumb {
    background: #fff; border-radius: 16px; padding: 10px; cursor: pointer;
    border: 2px solid transparent; text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
  }
  .thumb.active { border-color: #2b2622; }
  .thumb svg { width: 100%; height: auto; display: block; }
  .thumb span { display: block; font-size: 13px; font-weight: 600; margin-top: 6px; }
  .peek {
    position: fixed; z-index: 50; display: none; pointer-events: none;
    width: min(440px, 80vw); background: #fff; border-radius: 20px; padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.22);
  }
  .peek svg { width: 100%; height: auto; display: block; }
  .peek b { display: block; text-align: center; font-size: 14px; margin-top: 4px; }
  @media (hover: none) { .peek { display: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="card stage" id="stage"></div>
    <div class="card panel">
      <h1 id="title">Animal</h1>
      <p class="muted">Five colors drive each drawing. Pick any color to update it live.</p>
      <div class="row"><input type="color" id="c1" data-var="--c1"><label for="c1">Base<small>Main fur, feathers or shell</small></label><code data-hex="--c1"></code></div>
      <div class="row"><input type="color" id="c2" data-var="--c2"><label for="c2">Light facets<small>Lit planes of the body</small></label><code data-hex="--c2"></code></div>
      <div class="row"><input type="color" id="c3" data-var="--c3"><label for="c3">Cream<small>Belly, muzzle, pale markings</small></label><code data-hex="--c3"></code></div>
      <div class="row"><input type="color" id="c4" data-var="--c4"><label for="c4">Dark<small>Nose, stripes, socks, mane</small></label><code data-hex="--c4"></code></div>
      <div class="row"><input type="color" id="c5" data-var="--c5"><label for="c5">Accent<small>Eyes, horns, hooves, glow</small></label><code data-hex="--c5"></code></div>
      <div class="actions">
        <button id="reset">Reset</button>
        <button id="download" class="primary">Download SVG</button>
      </div>
    </div>
  </div>
  <h2>Favorites</h2>
  <div class="grid" id="grid-favorites"></div>
  <h2>Animals</h2>
  <div class="grid" id="grid-animals"></div>
  <h2>Creatures</h2>
  <div class="grid" id="grid-creatures"></div>
  <h2>Flyers</h2>
  <div class="grid" id="grid-flyers"></div>
  <h2>Deep sea</h2>
  <div class="grid" id="grid-deepsea"></div>
  <h2>Felines</h2>
  <div class="grid" id="grid-felines"></div>
  <h2>Bugs</h2>
  <div class="grid" id="grid-bugs"></div>
  <h2>Beasts</h2>
  <div class="grid" id="grid-beasts"></div>
  <h2>Dinos</h2>
  <div class="grid" id="grid-dinos"></div>
  <h2>Yokai</h2>
  <div class="grid" id="grid-yokai"></div>
  <h2>European folklore</h2>
  <div class="grid" id="grid-europe"></div>
  <h2>Hell</h2>
  <div class="grid" id="grid-hell"></div>
  <h2>Mythical sea creatures</h2>
  <div class="grid" id="grid-mythsea"></div>
  <h2>Wild</h2>
  <div class="grid" id="grid-wild"></div>
  <h2>Orochi variations</h2>
  <div class="grid" id="grid-orochi"></div>
</div>
<div class="peek" id="peek"></div>

<script>
  const SETS = [
    { dir: 'animals', grid: 'grid-animals', items: [
      ['fox', 'Fox'], ['wolf', 'Wolf'], ['cat', 'Cat'], ['deer', 'Deer'], ['rabbit', 'Rabbit'],
      ['owl', 'Owl'], ['horse', 'Horse'], ['tiger', 'Tiger'], ['redpanda', 'Red panda'], ['raven', 'Raven'],
    ]},
    { dir: 'creatures', grid: 'grid-creatures', items: [
      ['wolpertinger', 'Wolpertinger'], ['kitsune', 'Kitsune'], ['phoenix', 'Phoenix'], ['griffin', 'Griffin'],
      ['dragon', 'Dragon'], ['eastern-dragon', 'Eastern dragon'], ['unicorn', 'Unicorn'], ['manticore', 'Manticore'],
      ['cockatrice', 'Cockatrice'], ['cerberus', 'Cerberus'], ['cleaver-beetle', 'Cleaver beetle'],
      ['blade-mantis', 'Blade mantis'], ['lancer-hornet', 'Lancer hornet'], ['gem-scarab', 'Gem scarab'],
      ['crystal-spider', 'Crystal spider'], ['ember-scorpion', 'Ember scorpion'], ['sea-serpent', 'Sea serpent'],
      ['owlbear', 'Owlbear'], ['fire-salamander', 'Fire salamander'], ['luna-moth', 'Luna moth'],
    ]},
    { dir: 'flyers', grid: 'grid-flyers', items: [
      ['pegasus', 'Pegasus'], ['hippogriff', 'Hippogriff'], ['thunderbird', 'Thunderbird'], ['roc', 'Roc'],
      ['storm-wyvern', 'Storm wyvern'], ['fairy-dragon', 'Fairy dragon'], ['cloud-whale', 'Cloud whale'],
      ['sky-manta', 'Sky manta'], ['aether-jelly', 'Aether jelly'], ['dusk-bat', 'Dusk bat'],
      ['glass-dragonfly', 'Glass dragonfly'], ['sphinx-cat', 'Sphinx cat'], ['feathered-serpent', 'Feathered serpent'],
      ['peryton', 'Peryton'], ['winged-wolf', 'Winged wolf'], ['simurgh', 'Simurgh'], ['gargoyle', 'Gargoyle'],
      ['rhino-beetle', 'Rhino beetle'], ['sky-squid', 'Sky squid'], ['crest-wyrm', 'Crest wyrm'],
    ]},
    { dir: 'deepsea', grid: 'grid-deepsea', items: [
      ['crystal-crab', 'Crystal crab'], ['lantern-angler', 'Lantern angler'], ['ember-octopus', 'Ember octopus'],
      ['spire-hermit', 'Spire hermit'], ['leaf-dragon', 'Leaf dragon'], ['coral-seahorse', 'Coral seahorse'],
      ['star-warden', 'Star warden'], ['aurora-nautilus', 'Aurora nautilus'], ['stonefish-golem', 'Stonefish golem'],
      ['moray-wyrm', 'Moray wyrm'], ['trilobite-knight', 'Trilobite knight'], ['tide-turtle', 'Tide turtle'],
      ['reef-golem', 'Reef golem'], ['prism-shrimp', 'Prism shrimp'], ['drake-lobster', 'Drake lobster'],
      ['glow-nudibranch', 'Glow nudibranch'], ['bloom-anemone', 'Bloom anemone'], ['pearl-clam', 'Pearl clam'],
      ['flounder-phantom', 'Flounder phantom'], ['spider-crab', 'Spider crab'],
    ]},
    { dir: 'felines', grid: 'grid-felines', items: [
      ['storm-lion', 'Storm lion'], ['temple-sphinx', 'Temple sphinx'], ['spirit-lynx', 'Spirit lynx'],
      ['grin-cat', 'Grin cat'], ['bakeneko', 'Bakeneko'], ['crystal-panther', 'Crystal panther'],
      ['ember-tiger', 'Ember tiger'], ['frost-leopard', 'Frost leopard'], ['shadow-cat', 'Shadow cat'],
      ['guardian-shisa', 'Guardian shisa'], ['thunder-cheetah', 'Thunder cheetah'], ['moon-cat', 'Moon cat'],
      ['saber-fang', 'Saber fang'], ['dawn-lion', 'Dawn lion'], ['sand-caracal', 'Sand caracal'],
      ['kitten-sprite', 'Kitten sprite'], ['moss-ocelot', 'Moss ocelot'], ['aurora-lynx', 'Aurora lynx'],
      ['phantom-tiger', 'Phantom tiger'], ['horned-jaguar', 'Horned jaguar'],
    ]},
    { dir: 'bugs', grid: 'grid-bugs', items: [
      ['lantern-firefly', 'Lantern firefly'], ['atlas-moth', 'Atlas moth'], ['ember-butterfly', 'Ember butterfly'],
      ['antler-stag-beetle', 'Antler stag beetle'], ['ladybug-knight', 'Ladybug knight'], ['leaf-katydid', 'Leaf katydid'],
      ['orchid-mantis', 'Orchid mantis'], ['ant-queen', 'Ant queen'], ['jumper-spider', 'Jumper spider'],
      ['thousand-centipede', 'Thousand centipede'], ['damsel-sprite', 'Damsel sprite'], ['cicada-oracle', 'Cicada oracle'],
      ['amber-bumblebee', 'Amber bumblebee'], ['moon-cricket', 'Moon cricket'], ['silk-caterpillar', 'Silk caterpillar'],
      ['hawk-moth', 'Hawk moth'], ['dew-strider', 'Dew strider'], ['soldier-ant', 'Soldier ant'],
      ['earwig-knight', 'Earwig knight'], ['pill-guardian', 'Pill guardian'],
    ]},
    { dir: 'beasts', grid: 'grid-beasts', items: [
      ['magma-tortoise', 'Magma tortoise'], ['bloom-elephant', 'Bloom elephant'], ['crystal-rhino', 'Crystal rhino'],
      ['thorn-boar', 'Thorn boar'], ['blossom-stag', 'Blossom stag'], ['obsidian-bear', 'Obsidian bear'],
      ['moss-sloth', 'Moss sloth'], ['frost-mammoth', 'Frost mammoth'], ['storm-bull', 'Storm bull'],
      ['fang-hare', 'Fang hare'], ['totem-gorilla', 'Totem gorilla'], ['bastion-armadillo', 'Bastion armadillo'],
      ['spore-hog', 'Spore hog'], ['cactus-camel', 'Cactus camel'], ['lantern-giraffe', 'Lantern giraffe'],
      ['bone-howler', 'Bone howler'], ['acorn-squirrel', 'Acorn squirrel'], ['galaxy-yak', 'Galaxy yak'],
      ['comet-kangaroo', 'Comet kangaroo'], ['drill-mole', 'Drill mole'],
    ]},
    { dir: 'dinos', grid: 'grid-dinos', items: [
      ['volcano-stegosaurus', 'Volcano stegosaurus'], ['crystal-triceratops', 'Crystal triceratops'], ['storm-raptor', 'Storm raptor'],
      ['reef-rex', 'Reef rex'], ['garden-brachiosaurus', 'Garden brachiosaurus'], ['frost-ankylosaur', 'Frost ankylosaur'],
      ['aurora-pterosaur', 'Aurora pterosaur'], ['gear-compy', 'Gear compy'], ['ghost-allosaurus', 'Ghost allosaurus'],
      ['gem-parasaurolophus', 'Gem parasaurolophus'], ['moon-spinosaurus', 'Moon spinosaurus'], ['mushroom-pachy', 'Mushroom pachy'],
      ['lantern-oviraptor', 'Lantern oviraptor'], ['thunder-diplodocus', 'Thunder diplodocus'], ['jade-dilophosaurus', 'Jade dilophosaurus'],
      ['sunflower-styracosaurus', 'Sunflower styracosaurus'], ['amber-carnotaurus', 'Amber carnotaurus'], ['swamp-therizinosaur', 'Swamp therizinosaur'],
      ['egg-hatchling', 'Egg hatchling'], ['cloud-brontosaurus', 'Cloud brontosaurus'],
    ]},
    { dir: 'yokai', grid: 'grid-yokai', items: [
      ['tengu', 'Tengu'], ['kappa', 'Kappa'], ['oni', 'Oni'], ['tanuki', 'Bake-danuki'], ['nue', 'Nue'],
      ['baku', 'Baku'], ['kirin', 'Kirin'], ['karakasa', 'Karakasa'], ['jorogumo', 'Jorogumo'], ['kamaitachi', 'Kamaitachi'],
      ['chochin-obake', 'Chochin-obake'], ['kodama', 'Kodama'], ['ningyo', 'Ningyo'], ['hitotsume-kozo', 'Hitotsume-kozo'],
      ['yamata-orochi', 'Yamata-no-Orochi'], ['rokurokubi', 'Rokurokubi'], ['shachihoko', 'Shachihoko'],
      ['yatagarasu', 'Yatagarasu'], ['gashadokuro', 'Gashadokuro'], ['wanyudo', 'Wanyudo'],
    ]},
    { dir: 'europe', grid: 'grid-europe', items: [
      ['basilisk', 'Basilisk'], ['kraken', 'Kraken'], ['fenrir', 'Fenrir'], ['sleipnir', 'Sleipnir'],
      ['jormungandr', 'Jormungandr'], ['hippocampus', 'Hippocampus'], ['chimera', 'Chimera'], ['minotaur', 'Minotaur'],
      ['centaur', 'Centaur'], ['kelpie', 'Kelpie'], ['black-shuck', 'Black Shuck'], ['werewolf', 'Werewolf'],
      ['troll', 'Troll'], ['leshy', 'Leshy'], ['baba-yaga-hut', "Baba Yaga's hut"], ['lambton-worm', 'Lambton Worm'],
      ['peluda', 'Peluda'], ['tarasque', 'Tarasque'], ['questing-beast', 'Questing Beast'], ['nessie', 'Nessie'],
    ]},
    { dir: 'hell', grid: 'grid-hell', items: [
      ['brimstone-hound', 'Brimstone Hound'], ['cinder-bat', 'Cinder Bat'], ['hell-stag', 'Hell Stag'], ['brass-bull', 'Brass Bull'],
      ['pit-viper', 'Pit Viper'], ['carrion-fiend', 'Carrion Fiend'], ['soul-moth', 'Soul Moth'], ['pit-toad', 'Pit Toad'],
      ['nightmare', 'Nightmare'], ['hellspinner', 'Hellspinner'], ['pit-wyrm', 'Pit Wyrm'], ['torment-ram', 'Torment Ram'],
      ['skull-crab', 'Skull Crab'], ['imp-ape', 'Imp Ape'], ['rat-king', 'Rat King'], ['doom-owl', 'Doom Owl'],
      ['lava-eel', 'Lava Eel'], ['hell-hyena', 'Hell Hyena'], ['black-goat', 'Black Goat'], ['fly-lord', 'Fly Lord'],
      ['ember-weaver', 'Ember Weaver'], ['bone-widow', 'Bone Widow'], ['gloom-recluse', 'Gloom Recluse'], ['ash-tarantula', 'Ash Tarantula'],
    ]},
    { dir: 'mythsea', grid: 'grid-mythsea', items: [
      ['leviathan', 'Leviathan'], ['makara', 'Makara'], ['ningyo', 'Ningyo'], ['isonade', 'Isonade'],
      ['akkorokamui', 'Akkorokamui'], ['selkie', 'Selkie'], ['scylla', 'Scylla'], ['ceto', 'Ceto'],
      ['zaratan', 'Zaratan'], ['bakunawa', 'Bakunawa'], ['sea-monk', 'Sea Monk'], ['hafgufa', 'Hafgufa'],
      ['lusca', 'Lusca'], ['cadborosaurus', 'Cadborosaurus'], ['karkinos', 'Karkinos'], ['capricorn', 'Capricorn'],
      ['pristis', 'Pristis'], ['dobhar-chu', 'Dobhar-chu'], ['abaia', 'Abaia'], ['taniwha', 'Taniwha'],
    ]},
    { dir: 'wild', grid: 'grid-wild', items: [
      ['demon-kitten', 'Demon Kitten'], ['nian', 'Nian'], ['haetae', 'Haetae'], ['bulgasari', 'Bulgasari'],
      ['pixiu', 'Pixiu'], ['bixi', 'Bixi'], ['yali', 'Yali'], ['gajasimha', 'Gajasimha'],
      ['naga', 'Naga'], ['airavata', 'Airavata'], ['barong', 'Barong'], ['snow-lion', 'Snow Lion'],
      ['jackalope', 'Jackalope'], ['owlbear', 'Owlbear'], ['wyvern', 'Wyvern'], ['cockatrice', 'Cockatrice'],
      ['manticore', 'Manticore'], ['griffin', 'Griffin'], ['hodag', 'Hodag'], ['qiongqi', 'Qiongqi'],
    ]},
    { dir: 'orochi', grid: 'grid-orochi', items: [
      ['frost-orochi', 'Frost Orochi'], ['magma-orochi', 'Magma Orochi'], ['blossom-orochi', 'Blossom Orochi'],
      ['storm-orochi', 'Storm Orochi'], ['gold-orochi', 'Gold Orochi'], ['shadow-orochi', 'Shadow Orochi'],
      ['jade-orochi', 'Jade Orochi'], ['crystal-orochi', 'Crystal Orochi'], ['sleeping-orochi', 'Sleeping Orochi'],
    ]},
  ];
  const VARS = ['--c1', '--c2', '--c3', '--c4', '--c5'];
  const STORAGE_KEY = 'animal-colors';

  const stage = document.getElementById('stage');
  const title = document.getElementById('title');
  const inputs = [...document.querySelectorAll('input[type="color"][data-var]')];

  const markup = {};    // key -> svg source text
  const labels = {};    // key -> display name
  const defaults = {};  // key -> {--c1: '#..', ...}
  let colors = {};      // key -> current colors
  let current = 'animals/fox';

  try { colors = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { colors = {}; }

  function readDefaults(svgText) {
    const out = {};
    for (const v of VARS) {
      const m = svgText.match(new RegExp('var\\(' + v + ',\\s*(#[0-9A-Fa-f]{6})\\)'));
      out[v] = m ? m[1].toUpperCase() : '#888888';
    }
    return out;
  }

  function applyVars(el, c) {
    for (const v of VARS) el.style.setProperty(v, c[v]);
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(colors)); } catch {}
  }

  function updatePanel() {
    const c = colors[current];
    title.textContent = labels[current];
    for (const v of VARS) {
      const input = inputs.find(i => i.dataset.var === v);
      input.value = c[v].toLowerCase();
      document.querySelector(`code[data-hex="${v}"]`).textContent = c[v].toUpperCase();
    }
    applyVars(stage, c);
    document.querySelectorAll(`.thumb[data-animal="${current}"]`).forEach(t => applyVars(t, c));
  }

  function select(key) {
    current = key;
    stage.innerHTML = markup[key];
    document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('active', t.dataset.animal === key));
    updatePanel();
  }

  const peek = document.getElementById('peek');

  const FAVORITES = [
    'flyers/pegasus', 'flyers/aether-jelly', 'flyers/glass-dragonfly', 'flyers/simurgh', 'flyers/sky-squid',
    'flyers/crest-wyrm', 'creatures/fire-salamander', 'creatures/crystal-spider', 'creatures/sea-serpent',
    'creatures/kitsune', 'creatures/phoenix', 'creatures/dragon', 'creatures/lancer-hornet', 'creatures/gem-scarab',
    'animals/owl', 'animals/raven', 'animals/redpanda', 'animals/fox', 'animals/deer',
    'deepsea/crystal-crab', 'deepsea/ember-octopus', 'deepsea/leaf-dragon',
    'felines/moon-cat', 'felines/moss-ocelot', 'bugs/lantern-firefly', 'beasts/frost-mammoth', 'beasts/blossom-stag', 'beasts/bone-howler', 'beasts/lantern-giraffe', 'dinos/aurora-pterosaur', 'dinos/gem-parasaurolophus', 'dinos/thunder-diplodocus', 'yokai/baku', 'yokai/kirin', 'yokai/shachihoko', 'orochi/gold-orochi', 'europe/kraken', 'europe/fenrir', 'europe/jormungandr', 'europe/black-shuck', 'europe/nessie', 'hell/skull-crab', 'hell/nightmare', 'hell/torment-ram', 'hell/hellspinner', 'mythsea/cadborosaurus',
  ];

  function makeThumb(key) {
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.dataset.animal = key;
    thumb.innerHTML = markup[key] + `<span>${labels[key]}</span>`;
    applyVars(thumb, colors[key]);
    thumb.addEventListener('click', () => select(key));
    thumb.addEventListener('mouseenter', e => showPeek(key, e));
    thumb.addEventListener('mousemove', movePeek);
    thumb.addEventListener('mouseleave', () => { peek.style.display = 'none'; });
    return thumb;
  }

  function showPeek(key, e) {
    peek.innerHTML = markup[key] + `<b>${labels[key]}</b>`;
    applyVars(peek, colors[key]);
    peek.style.display = 'block';
    movePeek(e);
  }

  function movePeek(e) {
    const w = peek.offsetWidth, h = peek.offsetHeight, gap = 24;
    let x = e.clientX + gap;
    if (x + w > innerWidth - 8) x = e.clientX - gap - w;
    x = Math.max(8, x);
    const y = Math.min(Math.max(8, e.clientY - h / 2), innerHeight - h - 8);
    peek.style.left = x + 'px';
    peek.style.top = y + 'px';
  }

  async function init() {
    for (const set of SETS) {
      const grid = document.getElementById(set.grid);
      for (const [name, label] of set.items) {
        const key = `${set.dir}/${name}`;
        const text = await (await fetch(`${key}.svg`)).text();
        markup[key] = text.replace(/<\?xml[^>]*>\s*/, '');
        labels[key] = label;
        defaults[key] = readDefaults(text);
        colors[key] = { ...defaults[key], ...(colors[key] || {}) };

        grid.appendChild(makeThumb(key));
      }
    }
    const favGrid = document.getElementById('grid-favorites');
    FAVORITES.forEach(key => favGrid.appendChild(makeThumb(key)));
    select(current);
  }

  inputs.forEach(input => {
    input.addEventListener('input', () => {
      colors[current][input.dataset.var] = input.value.toUpperCase();
      updatePanel();
      save();
    });
  });

  document.getElementById('reset').addEventListener('click', () => {
    colors[current] = { ...defaults[current] };
    updatePanel();
    save();
  });

  // Bakes the current colors into a standalone SVG file.
  document.getElementById('download').addEventListener('click', () => {
    let out = '<?xml version="1.0" encoding="UTF-8"?>\n' + markup[current];
    for (const v of VARS) {
      out = out.replace(new RegExp('var\\(' + v + ',\\s*#[0-9A-Fa-f]{6}\\)', 'g'), colors[current][v]);
    }
    const blob = new Blob([out], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${current.split('/')[1]}.svg`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  init();
</script>
</body>
</html>
