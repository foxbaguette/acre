<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Farmhouse From Above</title>
<style>body{margin:0;background:#efe6d2;color:#2f2a22;font:15px/1.45 Georgia,serif}header{padding:28px 24px 8px;max-width:1300px;margin:0 auto}h1{margin:0 0 4px;font-size:26px}header p{margin:0;color:#7a6f5c}

.yard{display:flex;justify-content:center;gap:14px;padding:18px;background:radial-gradient(circle at 30% 20%,#8fb35a,#6f9440)}.yard img{width:150px;height:200px}.night{background:#1d2a33}

<header><h1>The mossy farmhouse, from above</h1><p>The same house drawn from its real shape at three camera heights: by day, and at night with its windows lit.</p></header><main>
<figure><div class="yard"><img src="../art/tiles/building-farmhouse-1.svg" alt=""><img class="night" src="farmhouses/stage-1-night.svg" alt=""></div><figcaption><b>Stage 1</b><div>1 farmer lives here.</div></figcaption></figure><figure><div class="yard"><img src="../art/tiles/building-farmhouse-2.svg" alt=""><img class="night" src="farmhouses/stage-2-night.svg" alt=""></div><figcaption><b>Stage 2</b><div>2 farmers live here.</div></figcaption></figure><figure><div class="yard"><img src="../art/tiles/building-farmhouse-3.svg" alt=""><img class="night" src="farmhouses/stage-3-night.svg" alt=""></div><figcaption><b>Stage 3</b><div>3 farmers live here.</div></figcaption></figure><figure><div class="yard"><img src="../art/tiles/building-farmhouse-4.svg" alt=""><img class="night" src="farmhouses/stage-4-night.svg" alt=""></div><figcaption><b>Stage 4</b><div>4 farmers live here.</div></figcaption></figure><figure><div class="yard"><img src="../art/tiles/building-farmhouse-5.svg" alt=""><img class="night" src="farmhouses/stage-5-night.svg" alt=""></div><figcaption><b>Stage 5</b><div>5 farmers live here.</div></figcaption></figure>
<figure><div class="yard"><img src="farmhouses/top-1.svg" alt=""><img class="night" src="farmhouses/top-1-night.svg" alt=""></div><figcaption><b>A  Nearly straight down</b><div>Tilt 0.2: the front wall shows as a thin strip.</div></figcaption></figure><figure><div class="yard"><img src="farmhouses/top-2.svg" alt=""><img class="night" src="farmhouses/top-2-night.svg" alt=""></div><figcaption><b>B  High</b><div>Tilt 0.32: the front wall shows as a narrow band.</div></figcaption></figure><figure><div class="yard"><img src="farmhouses/top-3.svg" alt=""><img class="night" src="farmhouses/top-3-night.svg" alt=""></div><figcaption><b>C  A little lower</b><div>Tilt 0.45: the front wall shows as a band you can read.</div></figcaption></figure>
</main></body></html>
