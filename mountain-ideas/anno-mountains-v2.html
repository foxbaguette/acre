<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anno Mountains</title>
<style>
  :root { --bg: #efe6d2; --ink: #2f2a22; --muted: #7a6f5c; --card: #fbf7ee; --line: #d9ccb2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, "Times New Roman", serif; }
  header { padding: 28px 24px 8px; max-width: 1500px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); max-width: 900px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; padding: 18px 24px 40px; max-width: 1500px; margin: 0 auto; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; aspect-ratio: 24 / 16; }
  figcaption { padding: 10px 14px 12px; }
  figcaption b { font-size: 16px; }
  figcaption b span { display: inline-block; min-width: 26px; color: #a0522d; }
  figcaption div { color: var(--muted); font-size: 14px; margin-top: 2px; }
  @media (max-width: 480px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } header { padding: 20px 16px 4px; } }
</style>
</head>
<body>
<header>
  <h1>Anno-style mountains</h1>
  <p>Ten mountains in the spirit of Anno, seen from above under the island's north-west sun. As in Anno, the ground follows the shape: grass on flat ground and ledges, bare rock only on steep faces, snow where it is high and flat, darker creases in the gullies.</p>
</header>
<main id="grid"></main>
<script>
const STYLES = [
  ['Classic massif', 'One broad mountain, a clear summit, a few big gullies. Grass climbs high on the gentle parts.'],
  ['Alpine snowfields', 'Taller, with snow lying in the high hollows and on the ledges, rock showing between.'],
  ['Forested foothills', 'Dense forest wrapping the lower slopes, rock and a little snow above the tree line.'],
  ['Layered cliffs', 'Rock in horizontal layers: green ledges with short rocky steps between them.'],
  ['Twin summits', 'Two peaks of different height with a grassy saddle between them.'],
  ['Long ridge', 'A range: one long crest with spurs running down both sides.'],
  ['Mesa', 'A wide grassy tableland on rocky walls, with soft slopes at its foot.'],
  ['Craggy outcrops', 'A lower, rugged mountain broken into a few big rocky knobs, green between.'],
  ['Volcanic cone', 'A dormant cone with a crater lake, smooth flanks and a few ravines.'],
  ['Mountain lake', 'A massif with a small lake in a high basin and a stream falling down the slope.'],
];

const VS = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform int uS; uniform int uPass; uniform sampler2D uHt;
out vec4 o;
const vec2 SIZE = vec2(24., 16.);
const vec2 C = vec2(12., 8.2);
const vec3 LIT = normalize(vec3(-.55, -.7, .62));
const vec2 LD = vec2(-.6181, -.7861);
vec3 rgb(float r, float g, float b) { return vec3(r, g, b) / 255.; }
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 grd(vec2 i) { float a = h12(i) * 6.2831853; return vec2(cos(a), sin(a)); }
float gn(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * f * (f * (f * 6. - 15.) + 10.);
  float a = dot(grd(i), f), b = dot(grd(i + vec2(1., 0.)), f - vec2(1., 0.)), c = dot(grd(i + vec2(0., 1.)), f - vec2(0., 1.)), d = dot(grd(i + 1.), f - 1.);
  return .5 + .7 * mix(mix(a, b, u.x), mix(c, d, u.x), u.y); }
float fbm(vec2 p) { return gn(p) * .57 + gn(p * 2.03 + 17.1) * .29 + gn(p * 4.1 + 9.2) * .14; }
float smax(float a, float b, float k) { float h = clamp(.5 + .5 * (a - b) / k, 0., 1.); return mix(b, a, h) + k * h * (1. - h); }
float smin(float a, float b, float k) { return -smax(-a, -b, k); }
vec2 h22(vec2 p) { return vec2(h12(p), h12(p + 19.19)); }
// a footprint 0..1: lumpy oval
float foot(vec2 p, vec2 c, vec2 r, float seed) {
  vec2 d = (p - c) / r; float a = atan(d.y, d.x);
  float k = length(d) * (1. + .16 * (gn(vec2(cos(a), sin(a)) * 1.2 + seed) - .5));
  return clamp(1. - k, 0., 1.);
}
// a massif: slow rise, steeper near the top, with n broad valleys running straight down from the summit
float massif(vec2 p, vec2 c, vec2 r, float tall, float n, float seed) {
  float f = foot(p, c, r, seed);
  vec2 d = (p - c) / r; float a = atan(d.y, d.x) / 6.2831853 * n + seed;
  float k0 = floor(a + .5), v = 0.;
  for (int j = -1; j <= 1; j++) { float x = a - (k0 + float(j)); v += (.6 + .4 * h12(vec2(k0 + float(j), seed))) * exp(-x * x / .05); }
  float valley = (1. - min(v, 1.)) * smoothstep(.08, .45, f) * (1. - smoothstep(.7, .95, f));
  return pow(f, 1.6) * (1. - .28 * valley) * tall;
}

float H(vec2 p) {
  if (uS == 0) return massif(p, C, vec2(8.5, 6.6), 3., 5., 1.3);
  if (uS == 1) return massif(p, C, vec2(8.8, 6.8), 3.8, 6., 4.1);
  if (uS == 2) return massif(p, C, vec2(9., 7.), 3.2, 5., 2.7);
  if (uS == 3) { float h = massif(p, C, vec2(8.5, 6.4), 2.6, 4., 6.2); float st = .65, t = h / st, fl = floor(t);
    float w = (gn(p * .5) - .5) * .25; return (fl + smoothstep(.62 + w, .9 + w, t - fl)) * st * .85 + h * .15; }
  if (uS == 4) return smax(massif(p, C + vec2(-3.4, -.5), vec2(5.6, 5.), 3.1, 5., 3.3), massif(p, C + vec2(4., 1.), vec2(4.8, 4.4), 2.3, 4., 8.6), .7);
  if (uS == 5) { float x = p.x - C.x, cy = C.y + 1.4 * sin(x * .26); float along = clamp(1. - x * x / 115., 0., 1.);
    float d = (p.y - cy) / 3.8, sp = .5 + .5 * cos(x * 1.25 + 1.); float f = clamp(along * (1. - abs(d) * (1. + .55 * (1. - sp) * smoothstep(.2, .7, abs(d)))), 0., 1.);
    return pow(f, 1.6) * 3. ; }
  if (uS == 6) { float f = foot(p, C, vec2(8., 6.), 5.); float top = smoothstep(.3, .46, f + (gn(p * .5) - .5) * .07);
    return top * 1.9 + pow(f, 1.3) * .5; }
  if (uS == 7) { float h = massif(p, C, vec2(9., 7.), .9, 3., 7.);   // a grassy hill carrying a few boulders
    for (int i = 0; i < 6; i++) { float fi = float(i); vec2 c = C + (i == 0 ? vec2(0.) : vec2(cos(fi * 2.4 + .5), sin(fi * 2.4 + .5)) * vec2(4.2, 3.) * (.8 + .3 * h12(vec2(fi, 4.))));
      float f = foot(p, c, vec2(2.2, 1.9) * (i == 0 ? 1.4 : .8 + .4 * h12(vec2(fi))), fi * 3. + 1.); h = smax(h, h * .5 + pow(f, .7) * (i == 0 ? 2.2 : 1.1 + .7 * h12(vec2(fi, 2.))), .25); }
    return h; }
  if (uS == 8) { float r = length((p - C) / vec2(1., .9)); float f = clamp(1. - r / 8.6, 0., 1.);
    float cone = massif(p, C, vec2(8.6, 7.7), 4., 7., 5.5); float rim = 4. * pow(1. - 1.9 / 8.6, 1.6);
    return r < 1.9 ? rim - .5 * smoothstep(1.9, 1.1, r) : min(cone, rim + (r - 1.9) * -.0 + 9.) * (r < 1.9 ? 1. : 1.) - max(0., cone - rim) ; }
  // 9: a massif with a shelf on its east shoulder holding a small lake
  float h = massif(p, C, vec2(8.8, 6.8), 3.4, 5., 9.2);
  vec2 lc = C + vec2(2.6, .4); float shelf = 1.5, dl = length((p - lc) / vec2(2.3, 1.7));
  return mix(h, min(h, shelf), smoothstep(1.4, .9, dl)) - smoothstep(1., .2, dl) * .08;
}

// the shade pass reads the heights the first pass stored
float T(vec2 q) {                                                          // bilinear by hand: float textures need not filter
  vec2 st = q / SIZE * uRes - .5; st.y = uRes.y - 1. - st.y; ivec2 i = ivec2(floor(st)), m = ivec2(uRes) - 1; vec2 f = fract(st);
  float a = texelFetch(uHt, clamp(i, ivec2(0), m), 0).r, b = texelFetch(uHt, clamp(i + ivec2(1, 0), ivec2(0), m), 0).r;
  float c = texelFetch(uHt, clamp(i + ivec2(0, 1), ivec2(0), m), 0).r, d = texelFetch(uHt, clamp(i + 1, ivec2(0), m), 0).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
void main() {
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y), p = px / uRes * SIZE;
  if (uPass == 0) { o = vec4(H(p), 0., 0., 1.); return; }
  float e = SIZE.x / uRes.x * 1.5, h = T(p), hx = T(p + vec2(e, 0.)), hy = T(p + vec2(0., e)), hx2 = T(p - vec2(e, 0.)), hy2 = T(p - vec2(0., e));
  vec2 g = vec2(hx - hx2, hy - hy2) / (2. * e);
  float slope = length(g);                                                   // rise per tile
  float cav = (hx + hx2 + hy + hy2 - 4. * h) / (e * e);                     // + in hollows, - on crests
  float n = fbm(p * .6), n2 = gn(p * 3.2);
  int s = uS;
  float hmax = s == 1 ? 3.8 : s == 8 ? 3.3 : s == 6 ? 2.4 : s == 7 ? 2.4 : 3.2;
  float hr = h / hmax;
  float rockA = smoothstep(.5, .78, slope + (n - .5) * .25 + hr * .2);
  if (s == 3 || s == 6) rockA = smoothstep(.75, 1.1, slope + (n - .5) * .2);
  if (s == 8) rockA = smoothstep(.75, 1., slope) * .8 + smoothstep(.85, .95, hr) * .6;
  // rock: chunky facets, each tilted its own way (Anno's rock reads as blocks, not as noise)
  vec2 q = p * 1.6; vec2 ci = floor(q), cf = fract(q); float d1 = 8.; vec2 cell = ci;
  for (int k = 0; k < 9; k++) { vec2 o2 = vec2(float(k % 3 - 1), float(k / 3 - 1)); float dd = length(o2 + h22(ci + o2) - cf); if (dd < d1) { d1 = dd; cell = ci + o2; } }
  vec2 tilt = (h22(cell + 5.) - .5) * .9;
  vec3 N = normalize(vec3(-g * (1. + rockA * .0) + tilt * rockA, 1.));
  float sh = 1., tanA = LIT.z / length(LIT.xy);
  for (int i = 1; i <= 32; i++) { float dd = float(i) * .2; sh = min(sh, 1. - smoothstep(0., .2, T(p + LD * dd) - (h + dd * tanA))); }
  vec3 grass = mix(rgb(96., 132., 58.), rgb(128., 160., 76.), n) * (.92 + .14 * n2);
  grass = mix(grass, mix(rgb(124., 140., 78.), rgb(146., 152., 96.), n), smoothstep(.4, .8, hr));
  vec3 rock = mix(rgb(118., 110., 100.), rgb(166., 156., 140.), h12(cell)) * (.9 + .12 * n2);
  if (s == 3 || s == 6) rock = mix(rgb(152., 120., 88.), rgb(190., 156., 118.), h12(cell)) * (.9 + .12 * n2);
  if (s == 8) rock = mix(rgb(88., 80., 76.), rgb(128., 118., 110.), h12(cell)) * (.9 + .12 * n2);
  vec3 col = mix(grass, rock, rockA);
  float snowLine = s == 1 ? .62 : s == 0 || s == 4 || s == 9 ? .8 : s == 2 ? .82 : s == 5 ? .82 : 9.;
  float snow = smoothstep(snowLine, snowLine + .05, hr + cav * .01 + (n - .5) * .08) * (1. - smoothstep(1.1, 1.5, slope));
  col = mix(col, rgb(238., 242., 247.), snow);
  if (s == 2 || s == 0 || s == 9) {                                          // forest on the gentle lower slopes
    float band = (s == 2 ? 1. : .5) * smoothstep(.04, .1, hr) * (1. - smoothstep(s == 2 ? .45 : .32, s == 2 ? .52 : .38, hr + (n - .5) * .12)) * (1. - rockA);
    vec2 tg = floor(p * 2.6); vec2 fc = fract(p * 2.6) - .5 + (h22(tg) - .5) * .45;
    float tree = step(length(fc), .38) * step(.2, h12(tg + 3.));
    vec3 canopy = mix(rgb(46., 82., 44.), rgb(66., 104., 52.), h12(tg + 11.)) * (1. - .3 * smoothstep(0., .38, length(fc + vec2(.14, .17))));
    col = mix(col, rgb(62., 92., 48.), band * .55); col = mix(col, canopy, band * tree);
  }
  float water = 0.;
  if (s == 8) water = 1. - smoothstep(1.35, 1.45, length((p - C) / vec2(1., .9)) + (n - .5) * .2);
  if (s == 9) { vec2 lc = C + vec2(2.6, .4); water = 1. - smoothstep(.95, 1.05, length((p - lc) / vec2(2.1, 1.5)) + (n - .5) * .15);
    float t = clamp(dot(p - lc, normalize(vec2(.5, 1.))) / 6., 0., 1.); vec2 sp = lc + normalize(vec2(.5, 1.)) * t * 6. + vec2(sin(t * 8.) * .3, 0.);
    water = max(water, (1. - smoothstep(.05, .12, length(p - sp))) * step(.25, t)); }
  float diff = max(dot(N, LIT), 0.) * sh;
  float ao = clamp(1. - max(cav, 0.) * .05, .7, 1.) * clamp(1. + min(cav, 0.) * -.02, 1., 1.1);
  vec3 lit = col * (vec3(.42, .47, .58) + vec3(1.05, .99, .88) * diff * 1.08) * ao;
  lit *= 1. - .25 * smoothstep(.0, .06, d1 * (1. - d1)) * 0.;
  if (water > 0.) lit = mix(lit, mix(rgb(54., 120., 136.), rgb(110., 170., 176.), n2) * (.8 + .25 * sh), water * .95);
  o = vec4(lit, 1.);
}`;

const grid = document.getElementById('grid');
STYLES.forEach(([name, note], i) => {
  const fig = document.createElement('figure');
  fig.innerHTML = `<canvas></canvas><figcaption><b><span>${i + 1}</span>${name}</b><div>${note}</div></figcaption>`;
  grid.appendChild(fig);
  const cv = fig.querySelector('canvas');
  setTimeout(() => draw(cv, i), 120 * i);
});
function draw(cv, style) {
  const dpr = Math.min(1.5, window.devicePixelRatio || 1), w = Math.round(cv.clientWidth * dpr), h = Math.round(w * 16 / 24);
  cv.width = w; cv.height = h;
  const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { cv.replaceWith(Object.assign(document.createElement('p'), { textContent: 'WebGL2 is not available.' })); return; }
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
  const ht = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, ht);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, w, h, 0, gl.RED, gl.FLOAT, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, ht, 0);
  gl.uniform2f(gl.getUniformLocation(pr, 'uRes'), w, h); gl.uniform1i(gl.getUniformLocation(pr, 'uS'), style);
  gl.viewport(0, 0, w, h);
  gl.bindTexture(gl.TEXTURE_2D, null);                   // never sample a texture while drawing into it (WebGL drops the draw)
  gl.uniform1i(gl.getUniformLocation(pr, 'uPass'), 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.bindTexture(gl.TEXTURE_2D, ht); gl.uniform1i(gl.getUniformLocation(pr, 'uHt'), 0);
  gl.uniform1i(gl.getUniformLocation(pr, 'uPass'), 1); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
</script>
</body>
</html>
